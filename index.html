<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape from Kelda Lighthouse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4ecef; --surface:#f8fbfb; --field:#ffffff; --ink:#15293a; --muted:#4a6375; --line:#b6c7cf;
  --lamp:#e9a516; --lamp-soft:#fbe7b5; --lamp-ink:#6a4300; --ok:#2b7a5e; --ok-soft:#dcefe7; --err:#b13a29; --err-soft:#f7e0dc;
  --sea:#2a5671; --rock:#5d6b73;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-head:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1c27; --surface:#162a38; --field:#1c3444; --ink:#e6eef1; --muted:#9fb4c1; --line:#2d4758;
    --lamp:#f3b83f; --lamp-soft:#3d3218; --lamp-ink:#f6c862; --ok:#5fc39b; --ok-soft:#163a2f; --err:#f08570; --err-soft:#43211c;
    --sea:#3f7c9e; --rock:#46545c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1c27; --surface:#162a38; --field:#1c3444; --ink:#e6eef1; --muted:#9fb4c1; --line:#2d4758;
  --lamp:#f3b83f; --lamp-soft:#3d3218; --lamp-ink:#f6c862; --ok:#5fc39b; --ok-soft:#163a2f; --err:#f08570; --err-soft:#43211c;
  --sea:#3f7c9e; --rock:#46545c; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.55;}
h1,h2,h3{font-family:var(--font-head);font-weight:700;line-height:1.15;margin:0 0 .5rem;}
h1{font-size:clamp(1.9rem,4vw,2.6rem);}
h2{font-size:1.45rem;}
p{margin:0 0 .9rem;}
button,input{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px;}

.shell{max-width:1080px;margin:0 auto;padding:1.5rem 1.25rem 3rem;display:grid;grid-template-columns:220px minmax(0,1fr);gap:2rem;align-items:start;}
aside{position:sticky;top:calc(1rem + env(safe-area-inset-top,0px));}
.tower svg{width:100%;max-width:200px;height:auto;display:block;margin:0 auto;}
.side-info{margin-top:.75rem;}
.team{font-family:var(--font-head);font-size:1.25rem;font-weight:700;margin:0;}
.timer{font-family:var(--font-head);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;margin:0;line-height:1.1;}
.timer.over{color:var(--err);}
.meta{color:var(--muted);font-size:.95rem;margin:.15rem 0 .6rem;}
.rooms{list-style:none;padding:0;margin:.5rem 0 1rem;font-size:.95rem;}
.rooms li{padding:.2rem 0 .2rem 1.6rem;position:relative;color:var(--muted);}
.rooms li::before{content:"";position:absolute;left:.25rem;top:.62rem;width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--line);}
.rooms li.done{color:var(--ink);}
.rooms li.done::before{background:var(--lamp);border-color:var(--lamp);}
.rooms li.now{color:var(--ink);font-weight:700;}
.rooms li.now::before{border-color:var(--lamp);}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem;}

.band{fill:var(--line);transition:fill .5s;}
.band.done{fill:var(--lamp);}
.band.now{fill:var(--surface);stroke:var(--lamp);stroke-width:2;}
.stripe{fill:var(--bg);opacity:.35;}
.lantern{fill:var(--surface);stroke:var(--ink);stroke-width:1.5;}
.gallery,.roof{fill:var(--ink);}
.lamp{fill:var(--line);}
.lamp.on{fill:var(--lamp);}
.rock{fill:var(--rock);}
.sea{fill:var(--sea);opacity:.85;}
.beam{fill:var(--lamp);opacity:0;}
.beam.on{opacity:.45;}
.beams.on{transform-origin:60px 63px;animation:sweep 4s ease-in-out infinite alternate;}
@keyframes sweep{from{transform:rotate(-8deg);}to{transform:rotate(8deg);}}

main{min-width:0;}
.roomno{color:var(--muted);font-size:.95rem;margin-bottom:.2rem;}
.story{max-width:62ch;font-size:1.1rem;}
.focus{color:var(--muted);font-size:.95rem;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.5rem;margin:1.25rem 0;}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.25rem 0 0;}
.tab{min-width:2.75rem;height:2.75rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;}
.tab.active{border-color:var(--ink);}
.tab.solved{background:var(--lamp);border-color:var(--lamp);color:#2a1b00;}
.tab.solved.active{border-color:var(--ink);}
.instr{color:var(--muted);font-size:.95rem;margin-bottom:.6rem;}
.sentence{font-size:1.3rem;line-height:2.1;max-width:62ch;}
.gap{display:inline-block;border:2px solid var(--line);background:var(--field);border-radius:8px;padding:.05rem .45rem;margin:0 .15rem;line-height:1.5;font-size:1.15rem;}
.gap.bad{border-color:var(--err);background:var(--err-soft);}
.gap.good,.gap:disabled{border-color:var(--ok);background:var(--ok-soft);opacity:1;}
dialog#help{width:min(680px, calc(100% - 2rem));max-height:85vh;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);}
dialog#help::backdrop{background:rgba(8,18,26,.6);}
#help-body{max-height:85vh;overflow-y:auto;}
.help-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.4rem;background:var(--surface);border-bottom:1px solid var(--line);}
.help-head h2{margin:0;font-size:1.35rem;}
.help-content{padding:1rem 1.4rem 1.4rem;}
.help-content h3{font-size:1.15rem;margin:1.2rem 0 .4rem;}
.help-content ul,.help-content ol{padding-left:1.3rem;margin:0 0 .9rem;}
.help-content li{margin-bottom:.3rem;}
.ex{border-left:3px solid var(--sea);padding:.2rem 0 .2rem .8rem;font-style:italic;}
.htable{border-collapse:collapse;margin:0 0 1rem;width:100%;font-size:.95rem;}
.htable th,.htable td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top;}
.help-list{display:grid;gap:.5rem;}
.help-list button{text-align:left;padding:.65rem .9rem;border:2px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;}
.help-list button:hover{border-color:var(--ink);}
.more{margin:.5rem 0 0;font-size:.95rem;}
.codehint{margin-top:1rem;}
.codehint .hint{margin-top:.5rem;}
.codehint .btn{margin-top:.75rem;}
.kt1{font-size:1.15rem;margin-bottom:.4rem;}
.kw{font-family:var(--font-head);font-weight:700;letter-spacing:.12em;font-size:1.2rem;color:var(--lamp-ink);margin-bottom:.2rem;}
.choices{display:grid;gap:.6rem;margin:.25rem 0 1rem;}
.choice{text-align:left;padding:.75rem 1rem;border:2px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;font-size:1.1rem;}
.choice:hover:not(:disabled){border-color:var(--ink);}
.choice.wrong{border-color:var(--err);background:var(--err-soft);text-decoration:line-through;cursor:not-allowed;}
.choice.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700;}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:.5rem;}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:.55rem 1.3rem;font-weight:700;cursor:pointer;}
.btn.primary{background:var(--ink);color:var(--bg);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.hint{background:var(--lamp-soft);border-left:4px solid var(--lamp);border-radius:6px;padding:.75rem 1rem;margin-top:1rem;}
.hint strong{color:var(--lamp-ink);}
.fb{margin-top:1rem;min-height:1px;}
.fb .no{color:var(--err);font-weight:700;margin:0;}
.why{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:6px;padding:.85rem 1rem;margin-top:1rem;}
.why .yes{color:var(--ok);font-weight:700;margin-bottom:.35rem;}
.why p:last-child{margin-bottom:0;}
.tray-label{color:var(--muted);font-size:.95rem;margin-bottom:.6rem;}
.tray{display:flex;flex-wrap:wrap;gap:.5rem;}
.slot{width:2.8rem;height:3.2rem;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.7rem;}
.slot.found{border-style:solid;border-color:var(--lamp);background:var(--lamp-soft);color:var(--lamp-ink);}
.lock{margin-top:1.25rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;}
.lock input{border:2px solid var(--ink);background:var(--field);border-radius:8px;padding:.5rem .8rem;font-family:var(--font-head);font-size:1.4rem;letter-spacing:.15em;text-transform:uppercase;width:12ch;}
.form-row{margin:1rem 0;}
.form-row label{display:block;font-weight:700;margin-bottom:.35rem;}
.form-row input[type=text]{border:2px solid var(--line);background:var(--field);border-radius:8px;padding:.55rem .8rem;width:100%;max-width:24rem;}
.seg{display:flex;flex-wrap:wrap;gap:.5rem;}
.seg button{border:2px solid var(--line);background:var(--field);border-radius:999px;padding:.4rem 1rem;cursor:pointer;}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700;}
.rules{max-width:62ch;padding-left:1.2rem;margin:0;}
.rules li{margin-bottom:.35rem;}
.stats{display:flex;flex-wrap:wrap;gap:2rem;margin:1rem 0;}
.stats div{min-width:7rem;}
.stats b{display:block;font-family:var(--font-head);font-size:2rem;}
.stats span{color:var(--muted);font-size:.95rem;}
.sol h2{margin-top:2rem;}
.sol ol{padding-left:1.4rem;}
.sol li{margin-bottom:.6rem;}
.sol b{color:var(--ok);}
.code-tag{font-family:var(--font-head);font-weight:700;letter-spacing:.12em;color:var(--lamp-ink);}
.err-text{color:var(--err);font-weight:700;}

@media (max-width:780px){
  .shell{grid-template-columns:1fr;gap:.5rem;padding-top:1rem;}
  aside{position:static;display:grid;grid-template-columns:96px 1fr;gap:1rem;align-items:center;}
  .tower svg{max-width:96px;}
  .side-info{margin-top:0;}
  .rooms{display:none;}
  .timer{font-size:1.8rem;}
  .sentence{font-size:1.15rem;}
  .panel{padding:1.1rem;}
}
@media (prefers-reduced-motion: reduce){
  .beams.on{animation:none;}
  .band{transition:none;}
}
body.teacher aside{display:none;}
body.teacher .shell{grid-template-columns:1fr;max-width:820px;}
</style>
</head>
<body>
<div class="shell">
  <aside id="side"></aside>
  <main id="main"></main>
  <dialog id="help" aria-labelledby="help-title"><div id="help-body"></div></dialog>
</div>
<script>
const GAP_INSTR = "Put the words in brackets into the correct form. Where there are question marks (???), find a suitable word of your own.";
const KT_INSTR = "Complete the second sentence so that it has a similar meaning to the first sentence. Use the KEY WORD and do not change it. Use between two and five words, including the KEY WORD.";

const ROOMS = [
  {
    title: "The Keeper’s Logbook",
    focus: "Past tenses, passive, substitute forms of can, conjunctions, used to",
    story: "On Mr Finch’s desk you find his logbook. The rain has soaked some pages and words are missing. Fill them in to find out what happened last night.",
    code: "ISLAND", scramble: "NLADSI", riddle: "Land with water all around it. You are standing on one right now.",
    tasks: [
      { type:"gap", text:"Last night the keeper ___ (WRITE) in his logbook when the radio suddenly ___ (START) to crackle.",
        answers:[["was writing"],["started"]],
        hint:"One action was in progress, and another one interrupted it.",
        why:"He was in the middle of writing: past progressive (was writing). The radio interrupts him: simple past (started)." },
      { type:"gap", text:"By the time we ___ (ARRIVE) at the lighthouse, the keeper ___ (LEAVE).",
        answers:[["arrived"],["had left","had already left"]],
        hint:"Which happened first?",
        why:"The keeper left before we arrived: past perfect (had left). Our arrival: simple past (arrived). leave – left – left." },
      { type:"gap", text:"The lighthouse ___ (BUILD) in 1886 by a Scottish engineer.",
        answers:[["was built"]],
        hint:"Did the lighthouse build itself? Look at the year, too.",
        why:"Passive in the past: was/were + past participle. build – built – built." },
      { type:"gap", text:"In his last entry Mr Finch wrote: “Yesterday I ___ (NOT CAN) reach the coastguard.”",
        answers:[["could not","was not able to"]],
        hint:"can doesn’t have all tenses. What is its past form?",
        why:"The past of can is could or was able to. Negative: couldn’t or wasn’t able to." },
      { type:"gap", text:"I didn’t go outside ___ (???) the wind was far too strong.",
        answers:[["because","as","since"]],
        hint:"The missing word introduces a reason.",
        why:"because (or as/since) introduces a reason." },
      { type:"kt", s1:"In the past, Mr Finch rowed to the village every Sunday.", key:"USED",
        before:"In the past, Mr Finch", after:"to the village every Sunday.",
        answers:["used to row"],
        hint:"This is about a habit in the past that doesn’t exist any more.",
        why:"used to + infinitive describes past habits: used to row." }
    ]
  },
  {
    title: "The Radio Room",
    focus: "Present tenses, present perfect (since/for), passive, reported speech",
    story: "The old radio crackles. The coastguard is trying to talk to you, but their messages are full of gaps.",
    code: "SIGNAL", scramble: "LGANIS", riddle: "A light, a sound or a sign that sends a message. The ship out at sea is waiting for one.",
    tasks: [
      { type:"gap", text:"Listen! The coastguard ___ (TRY) to contact us.",
        answers:[["is trying","are trying"]],
        hint:"Listen! What is happening right now?",
        why:"Listen! shows that something is happening at the moment of speaking: present progressive (is trying)." },
      { type:"gap", text:"We ___ (WAIT) for an answer for forty minutes now.",
        answers:[["have been waiting","have waited"]],
        hint:"The waiting started forty minutes ago and it isn’t over yet.",
        why:"Something started in the past, is still going on, and the length of time matters: present perfect progressive (have been waiting). have waited is also possible." },
      { type:"gap", text:"Mr Finch has worked on this island ___ (???) 2009.",
        answers:[["since"]],
        hint:"Is 2009 a point in time or a period of time?",
        why:"since + point in time (since 2009), for + period of time (for 17 years)." },
      { type:"gap", text:"Since this morning, storm warnings ___ (SEND) to all ships in the area.",
        answers:[["have been sent"]],
        hint:"The warnings don’t send themselves. And look out for since.",
        why:"Passive with since: present perfect passive, have been + past participle (have been sent)." },
      { type:"gap", text:"The coastguard ___ (ANSWER) our first call an hour ago, but they ___ (NOT REPLY) since then.",
        answers:[["answered"],["have not replied"]],
        hint:"Look at the signal words ago and since.",
        why:"an hour ago: simple past (answered). since then: present perfect (haven’t replied)." },
      { type:"kt", s1:"“The ship will reach the island at midnight,” the captain said.", key:"WOULD",
        before:"The captain said that the ship", after:"the island at midnight.",
        answers:["would reach"],
        hint:"Reported speech: the tense moves one step back.",
        why:"In reported speech, will becomes would: the ship would reach …" }
    ]
  },
  {
    title: "The Map Room",
    focus: "Relative clauses (who, which, whose, where, contact clauses), gerund",
    story: "Charts and maps cover the walls. Mr Finch has written notes all over them, but some words have faded.",
    code: "SECRET", scramble: "TCERSE", riddle: "Something you don’t tell anybody. Mr Finch’s maps seem to be full of them.",
    tasks: [
      { type:"gap", text:"Find the cave ___ (???) the old rowing boat is hidden.",
        answers:[["where"]],
        hint:"This describes a place.",
        why:"The cave is a place, so you need where." },
      { type:"gap", text:"The fisherman ___ (???) boat sank last winter lives in the village.",
        answers:[["whose"]],
        hint:"Who does the boat belong to?",
        why:"Possession: whose (the fisherman’s boat)." },
      { type:"kt", s1:"The woman runs the café. She knows the keeper well.", key:"WHO",
        before:"The woman", after:"the café knows the keeper well.",
        answers:["who runs"],
        hint:"Join the two sentences. The relative pronoun replaces she.",
        why:"who replaces she: The woman who runs the café … The -s for he/she/it stays on the verb." },
      { type:"gap", text:"The lighthouse, ___ (???) is the oldest on this coast, has 112 steps.",
        answers:[["which"]],
        hint:"Careful, commas!",
        why:"When the relative clause is extra information between commas, you can’t use that. For things, only which is possible." },
      { type:"kt", s1:"The keeper often talked about this room.", key:"ABOUT",
        before:"This is the room", after:".",
        answers:["the keeper often talked about"],
        hint:"You can only use five words. Do you really need a relative pronoun?",
        why:"Contact clause: after the relative pronoun comes a new subject (the keeper), so you can leave the pronoun out. The preposition about stays after the verb." },
      { type:"gap", text:"Mr Finch’s notes say: “Always avoid ___ (SAIL) near the rocks at night.”",
        answers:[["sailing"]],
        hint:"Some verbs are followed by -ing, others by to + infinitive.",
        why:"avoid is followed by the gerund: avoid sailing." }
    ]
  },
  {
    title: "The Workshop",
    focus: "Adjectives and adverbs, comparison",
    story: "Tools, ropes and a broken generator. To get the power back, you have to read Mr Finch’s repair notes correctly.",
    code: "KEEPER", scramble: "EREKPE", riddle: "The person who looks after a lighthouse. In football, there’s a goal______ too.",
    tasks: [
      { type:"gap", text:"The old generator still works ___ (PERFECT).",
        answers:[["perfectly"]],
        hint:"Ask yourself: How does it work?",
        why:"It describes how the generator works, so you need an adverb with -ly (perfectly)." },
      { type:"gap", text:"That was the ___ (BAD) storm of the year.",
        answers:[["worst"]],
        hint:"bad has irregular forms.",
        why:"bad – worse – the worst, just like good – better – the best." },
      { type:"gap", text:"This rope is not as ___ (STRONG) as the chain, but it is much ___ (LIGHT).",
        answers:[["strong"],["lighter"]],
        hint:"What comes between as … as? And what does much need?",
        why:"With (not) as … as, the adjective stays in its basic form (strong). much + comparative: much lighter." },
      { type:"gap", text:"The new battery is ___ (POWERFUL) than the old one.",
        answers:[["more powerful"]],
        hint:"Count the syllables.",
        why:"pow-er-ful has three syllables, so you use more: more powerful than." },
      { type:"gap", text:"Hurry up! We ___ (HARD) have any time left.",
        answers:[["hardly"]],
        hint:"This isn’t about something being difficult.",
        why:"hardly means “almost not”. The adverb of hard is also hard: We worked hard." },
      { type:"kt", s1:"The old lamp wasn’t as bright as the new one.", key:"BRIGHTER",
        before:"The new lamp", after:"the old one.",
        answers:["is brighter than","was brighter than"],
        hint:"Turn the comparison around.",
        why:"not as bright as becomes a comparative: brighter than." }
    ]
  },
  {
    title: "The Weather Station",
    focus: "Future forms, if-clauses type 1 to 3, substitute form of must",
    story: "Instruments are ticking and beeping everywhere. Read the forecast and plan what happens next.",
    code: "RESCUE", scramble: "CEUSER", riddle: "What the coastguard does when people are in danger at sea.",
    tasks: [
      { type:"gap", text:"Look at those black clouds! It ___ (RAIN) any minute.",
        answers:[["is going to rain"]],
        hint:"You can already see a clear sign.",
        why:"There’s a sign you can see (black clouds): going to-future (is going to rain)." },
      { type:"gap", text:"The ferry ___ (LEAVE) at 6.15 tomorrow morning. It’s in the timetable.",
        answers:[["leaves","is leaving"]],
        hint:"Timetables use a special form.",
        why:"Timetables and fixed programmes use the simple present: The ferry leaves …" },
      { type:"gap", text:"If the lamp ___ (WORK) again, the ship ___ (FIND) the harbour.",
        answers:[["works"],["will find"]],
        hint:"This can really happen. Which type of if-clause is it?",
        why:"Type 1: if + simple present (works), main clause with will (will find). Never use will in the if-part." },
      { type:"gap", text:"If we ___ (HAVE) a working radio, we ___ (CALL) for help right now.",
        answers:[["had"],["would call"]],
        hint:"Right now we don’t have a radio that works.",
        why:"Type 2, the condition isn’t true at the moment: if + simple past (had), main clause with would (would call)." },
      { type:"gap", text:"Because of the storm, the ship ___ (MUST) wait outside the harbour until tomorrow.",
        answers:[["will have to"]],
        hint:"must has no future form.",
        why:"The future of must is will have to." },
      { type:"kt", s1:"We didn’t check the forecast, so the storm took us by surprise.", key:"IF",
        before:"The storm wouldn’t have taken us by surprise", after:"the forecast.",
        answers:["if we had checked"],
        hint:"This is about the past, which you can’t change any more.",
        why:"Type 3: if + past perfect (if we had checked), main clause with would have + past participle." }
    ]
  },
  {
    title: "The Lamp Room",
    focus: "Mixed",
    story: "Halfway up the last staircase you hear knocking. Someone is locked in the store room. One last door, then the lamp!",
    code: "ESCAPE", scramble: "PECASE", riddle: "What you have wanted to do since the door slammed shut behind you!",
    tasks: [
      { type:"gap", text:"When we opened the store room door, Mr Finch ___ (SIT) on an old box.",
        answers:[["was sitting"]],
        hint:"What was he doing at the moment the door opened?",
        why:"He was sitting there when we opened the door: past progressive (was sitting)." },
      { type:"gap", text:"“I ___ (LOCK) in here since yesterday afternoon!” he shouted.",
        answers:[["have been locked"]],
        hint:"He didn’t lock himself in. And look out for since.",
        why:"Passive + since: present perfect passive (have been locked)." },
      { type:"gap", text:"He ___ (LOSE) his keys earlier, so he couldn’t get out.",
        answers:[["had lost"]],
        hint:"Which happened first?",
        why:"Losing the keys happened before he got stuck: past perfect (had lost)." },
      { type:"gap", text:"The cat ___ (???) lives in the lighthouse is called Captain.",
        answers:[["that","which"]],
        hint:"Here, animals are treated like things.",
        why:"For animals and things: which or that. You can’t leave it out because a verb (lives) comes next." },
      { type:"gap", text:"This ___ (BE) the ___ (EXCITING) night of my life so far!",
        answers:[["has been"],["most exciting"]],

const HELP = {
  present: { title: "Simple present and present progressive", html: `
    <h3>Simple present</h3>
    <p>Use it for habits, things that happen again and again, and facts. Also for timetables and fixed programmes.</p>
    <p>Signal words: always, usually, often, sometimes, never, every day, on Mondays</p>
    <p class="ex">My sister plays the drums. <br>We often go swimming on Fridays. <br>The bus leaves at 7.30.</p>
    <p>Careful: with he/she/it, add -s to the verb. Questions and negatives use do/does: <i>Does he play …? He doesn’t play …</i></p>
    <h3>Present progressive</h3>
    <p>Use it for actions that are happening right now or only for a short time. Form: am/is/are + -ing.</p>
    <p>Signal words: now, at the moment, today, Look!, Listen!</p>
    <p class="ex">Look! It’s snowing. <br>I’m staying with my aunt this week.</p>
    <p>Verbs like know, like, want, believe and understand are almost never used in the -ing form: <i>I know the answer</i> (not: I’m knowing).</p>` },
  presperf: { title: "Present perfect (simple and progressive)", html: `
    <p>The present perfect connects the past and the present. The result or the experience is important, not the exact time.</p>
    <p>Form: have/has + past participle (3rd form): <i>worked, seen, written</i></p>
    <p>Signal words: already, just, yet, ever, never, so far, since, for</p>
    <p class="ex">I’ve just finished my homework. <br>Have you ever been to London? <br>We have lived here since 2015. <br>She has had her dog for three years.</p>
    <h3>since or for?</h3>
    <p><b>since</b> + point in time (since Monday, since 2015, since I was a child), <b>for</b> + period of time (for two hours, for three years).</p>
    <p>Careful, German trap: “Ich wohne seit drei Jahren hier” is <i>I have lived here for three years</i>, not <i>I live here since …</i></p>
    <h3>Present perfect progressive</h3>
    <p>Use it when something has continued up to now and you want to stress how long: have/has been + -ing.</p>
    <p class="ex">I’ve been waiting for you for an hour!</p>
    <h3>Or simple past?</h3>
    <p>If a finished time in the past is mentioned (yesterday, last week, two days ago, in 2020), always use the simple past.</p>
    <p class="ex">I have lost my phone. (It’s still missing.) <br>I lost my phone yesterday. (The time is mentioned.)</p>` },
  pastprog: { title: "Simple past and past progressive", html: `
    <h3>Simple past</h3>
    <p>Use it for finished actions in the past, often with a time expression.</p>
    <p>Signal words: yesterday, last week/month/year, two days ago, in 2019, when I was young</p>
    <p>Form: verb + -ed (play – played, stop – stopped). You have to learn the irregular verbs (go – went, see – saw, write – wrote).</p>
    <p>Questions and negatives use did / didn’t + basic form: <i>Did you see it? I didn’t see it.</i> (not: didn’t saw)</p>
    <h3>Past progressive</h3>
    <p>Use it for an action that was in progress at a certain time in the past. Form: was/were + -ing.</p>
    <p>Signal words: while, at 8 o’clock yesterday, all evening</p>
    <h3>Both together</h3>
    <p>One action is in progress (past progressive) and another one interrupts it (simple past).</p>
    <p class="ex">I was having a shower when the phone rang. <br>While we were watching a film, the lights went out.</p>` },
  pastperf: { title: "Past perfect", html: `
    <p>You need the past perfect when you are talking about the past and something happened <b>even earlier</b>. Ask yourself: What happened first? That action gets the past perfect.</p>
    <p>Form: had + past participle (3rd form)</p>
    <p>Signal words: before, after, by the time, already, when</p>
    <p class="ex">When we got to the station, the train had already left. <br>After she had finished her homework, she went out. <br>I had never seen snow before I moved to Canada.</p>
    <p>Remember: with <b>after</b>, the past perfect comes right after after. With <b>before</b>, it goes in the other part of the sentence (the main clause).</p>` },
  future: { title: "The future: will, going to and more", html: `
    <p><b>will</b> for guesses and predictions (often with I think, probably, maybe) and for decisions you make on the spot, offers and promises.</p>
    <p class="ex">I think it will be sunny tomorrow. <br>The phone is ringing. I’ll get it!</p>
    <p><b>going to</b> for plans and intentions, and when you can already see a sign.</p>

  passive: { title: "The passive", html: `
    <p>Use the passive when it’s important <b>what happens</b>, not who does it. If you want to say who does it, add <b>by</b>.</p>
    <p>Form: a form of <b>be</b> + past participle. The form of be shows the tense.</p>
    <table class="htable">
      <tr><th>Tense</th><th>Example</th></tr>
      <tr><td>simple present</td><td>English <b>is spoken</b> here.</td></tr>
      <tr><td>present progressive</td><td>The road <b>is being repaired</b>.</td></tr>
      <tr><td>simple past</td><td>The bridge <b>was built</b> in 1950.</td></tr>
      <tr><td>present perfect</td><td>My bike <b>has been stolen</b>.</td></tr>
      <tr><td>past perfect</td><td>The tickets <b>had been sold</b> before we arrived.</td></tr>
      <tr><td>will-future</td><td>The results <b>will be published</b> tomorrow.</td></tr>
      <tr><td>with a modal verb</td><td>Phones <b>must be switched</b> off.</td></tr>

    <p>Tip: Can the subject do the action itself? If not (a bridge can’t build itself), you need the passive.</p>` },
  modals: { title: "Modal verbs and substitute forms", html: `
    <p>can and must don’t exist in every tense. Then you need a substitute form.</p>
    <table class="htable">
      <tr><th></th><th>can</th><th>must</th></tr>
      <tr><td>past</td><td>could / was able to</td><td>had to</td></tr>
      <tr><td>future</td><td>will be able to</td><td>will have to</td></tr>
      <tr><td>present perfect</td><td>have/has been able to</td><td>have/has had to</td></tr>
    </table>
    <p class="ex">When I was six, I could already read. <br>Yesterday we had to stay at school until five. <br>Next year you will be able to drive.</p>

  ifclauses: { title: "If-clauses type 1, 2 and 3", html: `
    <h3>Type 1: This can really happen</h3>
    <p>if + simple present, main clause with will + basic form</p>

    <h3>Type 2: unlikely, or not true right now</h3>
    <p>if + simple past, main clause with would + basic form</p>

  relative: { title: "Relative clauses and contact clauses", html: `
    <p>A relative clause gives more information about a person, a thing or a place.</p>
    <ul>
      <li><b>who</b> for people, <b>which</b> for things and animals</li>
      <li><b>that</b> for people and things (but not after a comma)</li>
      <li><b>whose</b> for possession</li>
      <li><b>where</b> for places</li>
    </ul>
    <p class="ex">The boy who sits next to me is from Italy. <br>That’s the café where we always meet. <br>I know a girl whose brother is a famous YouTuber.</p>
    <h3>Contact clauses: leaving out the pronoun</h3>
    <p>If who/which/that is followed by a new subject (I, you, he, my friend …), you can leave the pronoun out.</p>
    <p class="ex">The film (that) we watched was boring. <br>but: The film that won the prize was boring. (no new subject, so you can’t leave it out)</p>
    <h3>Prepositions at the end</h3>
    <p>In English, the preposition usually stays after the verb.</p>
    <p class="ex">This is the town I grew up in.</p>
    <h3>Relative clauses with commas</h3>
    <p>If the relative clause is only extra information between commas, you <b>can’t use that</b> and you can’t leave the pronoun out.</p>
    <p class="ex">My uncle, who lives in Berlin, is a pilot.</p>` },
  adverb: { title: "Adjective or adverb?", html: `
    <p>An <b>adjective</b> describes a noun (What is something like?). It also comes after be, look, feel, seem, sound and taste.</p>
    <p class="ex">She is a careful driver. <br>The soup tastes good.</p>
    <p>An <b>adverb</b> describes a verb (How does someone do something?), an adjective or a whole sentence.</p>
    <p class="ex">She drives carefully. <br>It was really cold. <br>Luckily, nobody was hurt.</p>
    <h3>How to form adverbs</h3>
    <p>Usually adjective + -ly. Watch the spelling: happy – happily, terrible – terribly, careful – carefully, fantastic – fantastically.</p>
    <p>Irregular: good – <b>well</b>, fast – fast, hard – hard, late – late</p>
    <p>Careful: <b>hardly</b> means “almost not”, <b>lately</b> means “recently”.</p>` },
  comparison: { title: "Comparison of adjectives", html: `
    <ul>
      <li>Short adjectives (one syllable): -er / -est (cold – colder – the coldest). Careful: big – bigger, hot – hotter</li>
      <li>Two syllables ending in -y: easy – easier – the easiest</li>

    <h3>How to compare</h3>

    <p>When the reporting verb is in the past (said, told, asked), the tense moves one step back.</p>

}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.solved) && s.solved.length === ROOMS.length && s.solved.every((a,i)=>a.length===ROOMS[i].tasks.length)) return s;
    }
  }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){
  let t = " " + String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"]/g,"") + " ";
  t = t.replace(/\b(do|does|did|was|were|is|are|has|have|had|could|should|would|must|ca|wo)nt\b/g,"$1n't");
  t = t.replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not")
       .replace(/\bi'm\b/g,"i am").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'re\b/g," are").replace(/'d\b/g," had");
  t = t.replace(/[.,!?;:–—]+/g," ");
  return t.split(/\s+/).filter(Boolean).join(" ");
}
function cuesOf(text){ return [...text.matchAll(/___ \(([^)]+)\)/g)].map(m => m[1]); }
function isSubseq(big, small){ const B = big.split(" "), s = small.split(" "); let i = 0; for(const w of B) if(w === s[i]) i++; return i === s.length && B.length > s.length; }
function gapMsg(val, answers, cue){
  const j = norm(val);
  if(!j) return "Write something in every gap first.";
  if(cue === "???" && j.split(" ").length > 1) return "Where you see ???, only one word is missing.";
  if(cue !== "???" && j === norm(cue)) return "You copied the word without changing it. You need a different form here.";
  if(answers.some(a => isSubseq(norm(a), j))) return "Almost! A word is missing, for example a helping verb (be, have, will) or to.";
  if(answers.some(a => isSubseq(j, norm(a)))) return "There’s one word too many.";
  return "";
}
function ktMsg(val, t){
  const tk = norm(val).split(" ").filter(Boolean);
  if(!tk.length) return "Write something in the gap first.";
  if(!tk.includes(t.key.toLowerCase())) return "The key word is missing or has been changed. It must appear in your answer exactly as given.";
  if(tk.length > 5) return `That’s ${tk.length} words. You can use five at most (short forms like didn’t count as two words).`;
  if(tk.length < 2) return "Too short: you need at least two words.";
  return "";
}
function fmt(sec){
  const neg = sec < 0; sec = Math.abs(Math.floor(sec));
  const m = Math.floor(sec/60), s = sec % 60;
  return (neg ? "+" : "") + m + ":" + String(s).padStart(2,"0");
}
function elapsed(){
  if(!S.startedAt) return 0;
  return ((S.finishedAt || Date.now()) - S.startedAt) / 1000;
}

/* ---------- Lighthouse ---------- */
function towerSVG(){
  const n = ROOMS.length, yB = 212, yT = 80, h = (yB - yT) / n;
  const xl = y => (26 + (yB - y) / (yB - yT) * 14).toFixed(1);
  const xr = y => (94 - (yB - y) / (yB - yT) * 14).toFixed(1);
  const finished = S.screen === "finale";
  let bands = "", lit = 0;
  for(let i = 0; i < n; i++){
    const b = yB - i*h, t = b - h;
    const done = finished || (S.screen === "room" && i < S.room);
    const now = S.screen === "room" && i === S.room;
    if(done) lit++;
    bands += `<polygon class="band${done?" done":""}${now?" now":""}" points="${xl(b)},${b.toFixed(1)} ${xr(b)},${b.toFixed(1)} ${xr(t)},${t.toFixed(1)} ${xl(t)},${t.toFixed(1)}"/>`;
    bands += `<rect class="stripe" x="56" y="${(t + h*0.3).toFixed(1)}" width="8" height="${(h*0.4).toFixed(1)}" rx="1.5"/>`;
  }
  return `<svg viewBox="0 0 120 240" role="img" aria-label="Lighthouse with ${lit} of ${n} floors lit">
    <g class="beams${finished?" on":""}">
      <polygon class="beam${finished?" on":""}" points="60,63 0,42 0,84"/>
      <polygon class="beam${finished?" on":""}" points="60,63 120,42 120,84"/>
    </g>
    ${bands}
    <rect class="gallery" x="34" y="76" width="52" height="5" rx="1"/>
    <rect class="lantern" x="44" y="52" width="32" height="24" rx="2"/>
    <circle class="lamp${finished?" on":""}" cx="60" cy="64" r="6.5"/>
    <polygon class="roof" points="40,53 80,53 60,34"/>
    <path class="rock" d="M6 232 Q18 208 42 212 L80 212 Q106 206 116 232 Z"/>
    <path class="sea" d="M0 228 Q15 221 30 228 T60 228 T90 228 T120 228 V240 H0 Z"/>
  </svg>`;
}

function renderSide(){
  const side = document.getElementById("side");
  let info = "";
  if(S.screen === "start"){
    info = `<p class="meta">Six rooms. One lighthouse. One storm.</p>`;
  } else {
    const rem = S.duration*60 - elapsed();
    info = `<p class="team">${esc(S.team)}</p>
      <p class="timer${rem<0?" over":""}" id="timer" aria-label="Time left">${fmt(rem)}</p>
      <p class="meta">Hints left: ${S.hintsLeft} of 3</p>
      <ol class="rooms">${ROOMS.map((r,i)=>{
        const done = S.screen==="finale" || i < S.room, now = S.screen==="room" && i===S.room;
        return `<li class="${done?"done":""}${now?" now":""}">${r.title}</li>`;
      }).join("")}</ol>
      <p><button class="linkbtn" data-help="">Grammar help</button></p>
      <button class="linkbtn" id="reset">Start again</button>`;
  }
  side.innerHTML = `<div class="tower">${towerSVG()}</div><div class="side-info">${info}</div>`;
  const rb = document.getElementById("reset");
  if(rb) rb.onclick = () => {
    askConfirm("Do you really want to start again? All of this team’s progress will be lost.", () => { S = fresh(); save(); render(); });
  };
}

/* ---------- Start ---------- */
function renderStart(main){
  main.innerHTML = `
    <h1>Escape from Kelda Lighthouse</h1>
    <p class="story">${INTRO}</p>
    <div class="panel">
      <h2>How it works</h2>
      <ol class="rules">
        <li>You play as a team and have to get through six rooms, one after the other.</li>
        <li>Every task you solve gives you a letter. The letters are mixed up: find the code word and use it to open the door.</li>
        <li>The tasks work like the Use of English part of the exam: put the words in brackets into the correct form, find a word of your own where you see ???, and rewrite sentences using a key word (two to five words).</li>
        <li>You can do the tasks in a room in any order.</li>
        <li>You have 3 hints for the whole game. After three wrong tries on a task, you get its hint for free.</li>
        <li>Use “Grammar help” to check how a grammar point works. It’s free and you can use it any time. If you can’t work out a code word, there are two clues for it.</li>
      </ol>
      <div class="form-row">
        <label for="team">Team name</label>
        <input type="text" id="team" maxlength="30" autocomplete="off" placeholder="e.g. The Storm Chasers" value="${esc(S.team)}">
      </div>
      <div class="form-row">

        <div class="seg" role="group" aria-labelledby="dur-label">
          ${[45,60,70].map(m=>`<button type="button" data-min="${m}" aria-pressed="${S.duration===m}">${m} minutes</button>`).join("")}
        </div>
      </div>
      <p id="start-err" class="err-text" aria-live="polite"></p>
      <button class="btn primary" id="start">Start the game</button>
    </div>`;
  main.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    S.duration = +b.dataset.min;
    main.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  document.getElementById("start").onclick = () => {
    const name = document.getElementById("team").value.trim();
    if(!name){ document.getElementById("start-err").textContent = "Give your team a name first."; document.getElementById("team").focus(); return; }
    S.team = name; S.screen = "room"; S.startedAt = Date.now(); save(); render();
  };

/* ---------- Room ---------- */
function renderRoom(main){
  const r = ROOMS[S.room], t = r.tasks[S.task], key = S.room + "-" + S.task, solved = S.solved[S.room][S.task];
  const allSolved = S.solved[S.room].every(Boolean);

  let body = "";
  if(t.type === "kt"){
    const w = Math.max(...t.answers.map(a => a.length), 14) + 3;
    body = `<p class="kt1">${esc(t.s1)}</p><p class="kw">${esc(t.key)}</p>
      <p class="sentence">${esc(t.before)} ${solved
        ? `<input class="gap" disabled value="${esc(t.answers[0])}" style="width:${w}ch" aria-label="Gap">`
        : `<input class="gap" data-g="0" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap">`}${t.after === "." ? "." : " " + esc(t.after)}</p>`;
  } else if(t.type === "gap"){
    const parts = t.text.split("___");
    let i = 0;
    body = `<p class="sentence">${parts.map((p, idx) => {
      if(idx === parts.length - 1) return esc(p);
      const g = i++, w = Math.max(...t.answers[g].map(a => a.length), 5) + 2;
      return esc(p) + (solved
        ? `<input class="gap" disabled value="${esc(t.answers[g][0])}" style="width:${w}ch" aria-label="Gap ${g+1}">`
        : `<input class="gap" data-g="${g}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${g+1}">`);
    }).join("")}</p>`;
  } else {
    const dis = S.disabled[key] || [];
    body = `<p class="sentence">${esc(t.text)}</p><div class="choices">${t.options.map((o, i) => {
      let cls = "choice";
      if(solved && i === t.correct) cls += " right";
      else if(dis.includes(i)) cls += " wrong";
      return `<button class="${cls}" data-i="${i}" ${solved || dis.includes(i) ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
  }

  const hintShown = S.hintsShown[key];
  const actions = solved ? "" : `<div class="actions">
      ${t.type !== "choice" ? `<button class="btn primary" id="check">Check</button>` : ""}
      ${hintShown ? "" : `<button class="btn" id="hintbtn" ${S.hintsLeft ? "" : "disabled"}>${S.hintsLeft ? `Use a hint (${S.hintsLeft} left)` : "No hints left"}</button>`}
      <button class="btn" data-help="">Grammar help</button>
    </div>`;

  const nextUnsolved = S.solved[S.room].findIndex(x => !x);
  const why = solved ? `<div class="why"><p class="yes">Correct! You found the letter ${r.scramble[S.task]}.</p><p>${t.why}</p>${topicLinks(t)}</div>
      ${nextUnsolved >= 0 ? `<div class="actions"><button class="btn primary" id="next">Next task</button></div>` : ""}` : "";

  const tray = `<div class="panel">
      <p class="tray-label">Code letters (mixed up): Which word do they make?</p>
      <div class="tray">${r.tasks.map((_, i) => S.solved[S.room][i]
        ? `<div class="slot found">${r.scramble[i]}</div>` : `<div class="slot" aria-label="not found yet"></div>`).join("")}</div>
      ${allSolved ? `<div class="lock">
          <label for="code" class="sr">Code word</label>
          <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10">
          <button class="btn primary" id="open">${S.room === ROOMS.length - 1 ? "Switch on the lamp" : "Open the door"}</button>
        </div><p id="lock-fb" class="err-text" aria-live="polite"></p>${codeHintHTML(r)}` : ""}
    </div>`;

  main.innerHTML = `
    <p class="roomno">Room ${S.room + 1} of ${ROOMS.length}</p>
    <h1>${r.title}</h1>
    <p class="story">${r.story}</p>
    <nav class="tabs" aria-label="Tasks">${r.tasks.map((_, i) =>
      `<button class="tab${S.solved[S.room][i] ? " solved" : ""}${i === S.task ? " active" : ""}" data-t="${i}" aria-label="Task ${i+1}${S.solved[S.room][i] ? ", solved" : ""}" ${i === S.task ? 'aria-current="true"' : ""}>${i+1}</button>`).join("")}</nav>
    <section class="panel" aria-labelledby="task-h">
      <p class="instr" id="task-h">Task ${S.task + 1}: ${t.type === "kt" ? KT_INSTR : t.type === "gap" ? GAP_INSTR : t.de}</p>
      ${body}
      ${actions}
      <div class="hint-box">${hintShown ? hintHTML(t) : ""}</div>
      <div class="fb" id="fb" aria-live="polite"></div>
      ${why}
    </section>
    ${tray}`;

  main.querySelectorAll(".tab").forEach(b => b.onclick = () => { S.task = +b.dataset.t; save(); render(); });

  if(!solved && (t.type === "gap" || t.type === "kt")){
    const inputs = [...main.querySelectorAll("input.gap")];
    const cues = t.type === "gap" ? cuesOf(t.text) : [];
    const check = () => {
      let ok = true, msg = "";
      inputs.forEach(inp => {
        const g = +inp.dataset.g;
        const acc = t.type === "kt" ? t.answers : t.answers[g];
        const good = acc.some(a => norm(a) === norm(inp.value));
        inp.classList.toggle("bad", !good);
        if(!good){
          ok = false;
          if(!msg) msg = t.type === "kt" ? ktMsg(inp.value, t) : gapMsg(inp.value, acc, cues[g]);
        }
      });
      if(ok){ S.solved[S.room][S.task] = true; save(); render(); }
      else if(/^(Write something|The key word|That’s \d|Too short|Where you see)/.test(msg)){
        document.getElementById("fb").innerHTML = `<p class="no">${msg}</p>`;
      }
      else wrongAttempt(key, t, inputs.find(i => i.classList.contains("bad")), msg);
    };
    document.getElementById("check").onclick = check;
    inputs.forEach(inp => inp.addEventListener("keydown", e => { if(e.key === "Enter") check(); }));
    inputs.forEach(inp => inp.addEventListener("input", () => inp.classList.remove("bad")));
  }
  if(!solved && t.type === "choice"){
    main.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if(i === t.correct){ S.solved[S.room][S.task] = true; save(); render(); }
      else {
        (S.disabled[key] = S.disabled[key] || []).push(i);
        b.classList.add("wrong"); b.disabled = true;
        wrongAttempt(key, t, null);
      }
    });
  }
  const hb = document.getElementById("hintbtn");
  if(hb) hb.onclick = () => {
    if(!S.hintsLeft) return;
    S.hintsLeft--; S.hintsUsed++; S.hintsShown[key] = true; save();
    hb.remove();
    main.querySelector(".hint-box").innerHTML = hintHTML(t);
    renderSide();
  };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    const after = S.solved[S.room].findIndex((x, i) => !x && i > S.task);
    S.task = after >= 0 ? after : S.solved[S.room].findIndex(x => !x);
    save(); render();
  };
  const chb = document.getElementById("codehint");
  if(chb) chb.onclick = () => {
    S.codeHints = S.codeHints || {};
    S.codeHints[S.room] = (S.codeHints[S.room] || 0) + 1;
    save(); render();
    const c = document.getElementById("code"); if(c) c.focus({preventScroll:true});
  };
  const ob = document.getElementById("open");
  if(ob){
    const codeIn = document.getElementById("code");
    const tryOpen = () => {
      if(norm(codeIn.value) === r.code.toLowerCase()){
        if(S.room === ROOMS.length - 1){ S.screen = "finale"; S.finishedAt = Date.now(); }
        else { S.room++; S.task = 0; }
        save(); render(); window.scrollTo(0, 0);
      } else {
        document.getElementById("lock-fb").textContent = "The door doesn’t move. Look at the letters again.";
      }
    };
    ob.onclick = tryOpen;
    codeIn.addEventListener("keydown", e => { if(e.key === "Enter") tryOpen(); });
    if(nextUnsolved < 0 && solved) codeIn.focus({preventScroll:true});
  }
}
function hintHTML(t){ return `<div class="hint"><strong>Hint:</strong> ${t.hint}${topicLinks(t)}</div>`; }
function topicLinks(t){
  if(!t.topics || !t.topics.length) return "";
  return `<p class="more">Read more: ${t.topics.map(k => `<button class="linkbtn" data-help="${k}">${HELP[k].title}</button>`).join(", ")}</p>`;
}
function codeHintHTML(r){
  const n = (S.codeHints || {})[S.room] || 0;
  let out = `<div class="codehint">`;
  if(n >= 1) out += `<p class="hint"><strong>Clue:</strong> ${r.riddle}</p>`;
  if(n >= 2) out += `<p class="hint"><strong>Another clue:</strong> The word starts with ${r.code[0]} and ends with ${r.code[r.code.length - 1]}.</p>`;
  if(n < 2) out += `<button class="btn" id="codehint">${n === 0 ? "Get a clue" : "Get another clue"}</button>`;
  return out + `</div>`;
}
function wrongAttempt(key, t, focusEl, extra){
  S.wrong++;
  S.attempts[key] = (S.attempts[key] || 0) + 1;
  const fb = document.getElementById("fb");
  let msg = "Not quite. " + (extra || "Try again.");
  if(S.attempts[key] >= 3 && !S.hintsShown[key]){
    S.hintsShown[key] = "free";
    document.querySelector(".hint-box").innerHTML = hintHTML(t);
    const hb = document.getElementById("hintbtn"); if(hb) hb.remove();
    msg = "Not quite. " + (extra ? extra + " " : "") + "Here’s a free hint.";
  }
  fb.innerHTML = `<p class="no">${msg}</p>`;
  save();
  if(focusEl) focusEl.focus();
}

/* ---------- Finale ---------- */

        }

/* ---------- Bestätigung (statt confirm, das im Artefakt blockiert wird) ---------- */

  b.innerHTML = `<div class="help-content"><h2 id="help-title">Start again</h2><p>${msg}</p>

/* ---------- Hilfe-Fenster ---------- */
function openHelp(id){
  const d = document.getElementById("help"), b = document.getElementById("help-body");
  const topic = HELP[id];
  b.innerHTML = `<div class="help-head"><h2 id="help-title">${topic ? topic.title : "Grammar help"}</h2><button class="btn" data-close>Close</button></div>
    <div class="help-content">${topic
      ? topic.html + `<p class="help-back"><button class="linkbtn" data-help="">Show all topics</button></p>`
      : `<p>Choose a topic. Read the rule and look at the examples, then go back to your task.</p>
         <div class="help-list">${Object.entries(HELP).map(([k, v]) => `<button data-help="${k}">${v.title}</button>`).join("")}</div>`}</div>`;
  if(!d.open) d.showModal();
  b.scrollTop = 0;
}
document.addEventListener("click", e => {
  const h = e.target.closest("[data-help]");

  if(e.target.closest("[data-close]")) document.getElementById("help").close();

document.getElementById("help").addEventListener("click", e => { if(e.target.id === "help") e.target.close(); });

/* ---------- PDF booklet ---------- */
function personalTopics(){
  const set = new Set();
  ROOMS.forEach((r, ri) => r.tasks.forEach((t, ti) => {
    const k = ri + "-" + ti;
    if((S.attempts[k] || 0) > 0 || S.hintsShown[k]) t.topics.forEach(x => set.add(x));
  }));
  return Object.keys(HELP).filter(k => set.has(k));
}
function pdfText(s){
  return String(s).replace(/[’‘]/g,"'").replace(/[“”„]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/→/g,"->").replace(/\u00a0/g," ");
}
function htmlText(frag){ const d = document.createElement("div"); d.innerHTML = frag; return d.textContent.replace(/\s+/g," ").trim(); }

function buildBooklet(topicIds, personal){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const M = 18, W = 210 - 2*M, BOTTOM = 297 - 16;
  const INK = [21,41,58], MUTED = [74,99,117], AMBER = [176,112,0], SEA = [42,86,113];
  let y = M;
  const need = h => { if(y + h > BOTTOM){ doc.addPage(); y = M; } };
  const write = (str, o = {}) => {
    const size = o.size || 11, lh = size * 0.47, indent = o.indent || 0;
    doc.setFont("helvetica", o.style || "normal"); doc.setFontSize(size); doc.setTextColor(...(o.color || INK));
    const lines = doc.splitTextToSize(pdfText(str), W - indent);
    lines.forEach(l => { need(lh); doc.text(l, M + indent, y + lh * 0.78); y += lh; });
    y += (o.gap === undefined ? 1.6 : o.gap);
  };
  const rule = () => { need(4); doc.setDrawColor(...SEA); doc.setLineWidth(0.4); doc.line(M, y, M + W, y); y += 4; };
  const exLines = lines => {
    const size = 10.5, lh = size * 0.47;
    const all = [];
    lines.forEach(l => doc.splitTextToSize(pdfText(l), W - 7).forEach(x => all.push(x)));
    need(Math.min(all.length, 3) * lh + 2);
    const startY = y;
    doc.setFont("helvetica","italic"); doc.setFontSize(size); doc.setTextColor(...INK);
    all.forEach(l => { if(y + lh > BOTTOM){ doc.setDrawColor(...SEA); doc.setLineWidth(0.8); doc.line(M + 1.5, startY, M + 1.5, y); doc.addPage(); y = M; } doc.text(l, M + 6, y + lh * 0.78); y += lh; });
    doc.setDrawColor(...SEA); doc.setLineWidth(0.8); doc.line(M + 1.5, Math.max(M, y - all.length * lh), M + 1.5, y);
    y += 2.2;
  };
  const table = el => {
    const rows = [...el.querySelectorAll("tr")].map(tr => [...tr.children].map(c => ({ t: pdfText(c.textContent.trim()), head: c.tagName === "TH" })));
    const n = Math.max(...rows.map(r => r.length)), cw = W / n, size = 10, lh = size * 0.47;
    rows.forEach(r => {
      doc.setFontSize(size);
      const cells = r.map(c => doc.splitTextToSize(c.t, cw - 3));
      const h = Math.max(...cells.map(c => c.length)) * lh + 2.4;
      need(h);
      r.forEach((c, i) => {
        doc.setFont("helvetica", c.head ? "bold" : "normal"); doc.setTextColor(...INK);
        cells[i].forEach((l, j) => doc.text(l, M + i * cw + 1, y + 1.4 + lh * 0.78 + j * lh));
      });
      y += h; doc.setDrawColor(200,212,218); doc.setLineWidth(0.2); doc.line(M, y, M + W, y);
    });
    y += 3;
  };
  const renderHelp = html => {
    const box = document.createElement("div"); box.innerHTML = html;
    [...box.children].forEach(el => {
      const tag = el.tagName;
      if(tag === "H3"){ y += 1.5; write(el.textContent, { size:12.5, style:"bold", color:SEA, gap:1.2 }); }
      else if(tag === "P" && el.classList.contains("ex")) exLines(el.innerHTML.split(/<br\s*\/?>/i).map(htmlText).filter(Boolean));
      else if(tag === "P") write(el.textContent.replace(/\s+/g," ").trim());
      else if(tag === "UL" || tag === "OL") [...el.children].forEach((li, i) => write((tag === "OL" ? (i+1) + ". " : "- ") + li.textContent.replace(/\s+/g," ").trim(), { indent:3, gap:1 }));
      else if(tag === "TABLE") table(el);
    });
  };

  /* Cover */
  doc.setFillColor(...SEA); doc.rect(0, 0, 210, 62, "F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(28);
  doc.text("Grammar Booklet", M, 32);
  doc.setFont("helvetica","normal"); doc.setFontSize(13);
  doc.text(pdfText("Escape from Kelda Lighthouse – " + (personal ? "personal review" : "complete review")), M, 44);
  y = 76;
  if(S.team) write("Team: " + S.team, { size:13, style:"bold" });
  write("Date: " + new Date().toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" }), { color:MUTED });
  if(S.finishedAt){
    const used = Math.round((S.finishedAt - S.startedAt) / 60000);
    write(`Time: ${used} minutes   Hints used: ${S.hintsUsed}   Wrong tries: ${S.wrong}`, { color:MUTED });
  }
  y += 4; rule();
  write(personal ? "These are the grammar topics where your team made mistakes or needed a hint:" : "This booklet covers all the grammar from the escape room:", { size:12, style:"bold" });
  topicIds.forEach(k => write("- " + HELP[k].title, { indent:3, gap:0.8 }));
  y += 4;
  write("How to use this booklet", { size:12, style:"bold", color:SEA });
  write("1. Read the review for each topic and look carefully at the examples.", { indent:3, gap:0.8 });
  write("2. Do the practice exercises without looking at the answers.", { indent:3, gap:0.8 });
  write("3. Check your answers in the answer key at the end. Read the rule again if something was wrong.", { indent:3, gap:0.8 });

  /* Topics */
  topicIds.forEach(k => {
    doc.addPage(); y = M;
    write(HELP[k].title, { size:18, style:"bold", gap:2 });
    rule();
    write("Review", { size:13, style:"bold", color:AMBER, gap:1.4 });
    renderHelp(HELP[k].html);
    const items = PRACTICE[k] || [];
    if(!items.length) return;
    y += 3; need(30);
    write("Practice", { size:13, style:"bold", color:AMBER, gap:1.4 });
    const hasKt = items.some(i => i.kt), hasGap = items.some(i => !i.kt);
    if(hasGap) write(GAP_INSTR, { size:10, style:"italic", color:MUTED });
    if(hasKt) write(KT_INSTR, { size:10, style:"italic", color:MUTED });
    y += 1;
    items.forEach((it, i) => {
      need(16);
      if(it.kt){
        write(`${i+1}. ${it.s1}`, { gap:0.8 });
        write(it.key, { indent:5, style:"bold", color:AMBER, gap:0.8 });
        write(`${it.before} ________________________ ${it.after === "." ? "" : it.after}`.replace(/\s+$/, it.after === "." ? "." : ""), { indent:5, gap:4 });
      } else {
        write(`${i+1}. ${it.t.replace(/___/g, "____________")}`, { gap:4 });
      }
    });
  });

  /* Answer key */
  doc.addPage(); y = M;
  write("Answer Key", { size:18, style:"bold", gap:2 });
  rule();
  topicIds.forEach(k => {
    const items = PRACTICE[k] || [];
    if(!items.length) return;
    need(14);
    write(HELP[k].title, { size:11.5, style:"bold", color:SEA, gap:1 });
    items.forEach((it, i) => write(`${i+1}. ${it.a}`, { indent:3, size:10.5, gap:0.6 }));
    y += 3;
  });

  /* Page numbers */
  const pages = doc.getNumberOfPages();
  for(let p = 2; p <= pages; p++){
    doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...MUTED);
    doc.text(`Grammar Booklet - page ${p} of ${pages}`, 210 - M, 297 - 9, { align:"right" });
  }
  return doc.output("blob");
}

async function downloadBooklet(kind, btn){
  const status = document.getElementById("pdf-status");
  const say = m => { if(status) status.textContent = m; };
  if(!window.jspdf){ say("The PDF tool couldn’t load. Check your internet connection and reload the page."); return; }
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if(!dl){ say("Downloading isn’t available in this view. Open the game inside Claude to download the booklet."); return; }
  const personal = kind === "personal";
  const topics = personal ? personalTopics() : Object.keys(HELP);
  if(!topics.length){ say("There are no mistakes to review. Well done!"); return; }
  btn.disabled = true; say("Preparing your PDF…");
  try{
    const blob = buildBooklet(topics, personal);
    const slug = (S.team || "team").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "team";
    await dl.save({ filename: personal ? `grammar-booklet-${slug}.pdf` : "grammar-booklet-complete.pdf", data: blob });
    say("Your booklet has been saved.");
  }catch(e){
    const c = e && e.code;
    if(c === "declined") say("Download cancelled.");
    else if(c === "rate_limited") say("Please wait a moment and try again.");
    else say("The PDF couldn’t be saved here. Please try again.");
  }finally{ btn.disabled = false; }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pdf]");
  if(b){ e.preventDefault(); downloadBooklet(b.dataset.pdf, b); }
});

/* ---------- Main ---------- */
function render(){
  const main = document.getElementById("main");
  const teacher = location.hash === "#lehrer" || location.hash === "#teacher";
  document.body.classList.toggle("teacher", teacher);
  if(teacher){ renderTeacher(main); return; }
  if(S.screen === "start") renderStart(main);
  else if(S.screen === "room") renderRoom(main);
  else renderFinale(main);
  renderSide();
}
window.addEventListener("hashchange", render);
setInterval(() => {
  const el = document.getElementById("timer");
  if(!el || !S.startedAt || S.finishedAt) return;
  const rem = S.duration*60 - elapsed();
  el.textContent = fmt(rem);
  el.classList.toggle("over", rem < 0);
}, 1000);
render();
</script>
